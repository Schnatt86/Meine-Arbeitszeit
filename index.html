<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeiterfassung & Stundenzettel</title>
    <!-- React & Tailwind CSS CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translate(-50%, 15px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }
        .animate-toast {
            animation: fadeInUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background: white !important; }
            .sheet { box-shadow: none !important; margin: 0 !important; width: 100% !important; padding: 0 !important; }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const TYPES = [
            { id: 'arbeit', label: 'Arbeit', icon: '💼', isAbsence: false },
            { id: 'urlaub', label: 'Urlaub', icon: '🌴', isAbsence: true },
            { id: 'krank', label: 'Krank', icon: '🩺', isAbsence: true },
            { id: 'kind', label: 'Kind', icon: '👶', isAbsence: true },
            { id: 'feiertag', label: 'Feiertag', icon: '🎉', isAbsence: true },
            { id: 'frei', label: 'Frei', icon: '☕', isAbsence: false },
        ];

        function App() {
            const [tab, setTab] = useState('eintragen'); // 'eintragen' | 'uebersicht'
            const [selectedDate, setSelectedDate] = useState(() => new Date().toISOString().split('T')[0]);
            const [entryType, setEntryType] = useState('arbeit');
            const [beginn, setBeginn] = useState('08:00');
            const [ende, setEnde] = useState('16:30');
            const [pause, setPause] = useState('30');
            const [wochenSoll, setWochenSoll] = useState(15);
            const [sollStundenTag, setSollStundenTag] = useState(3.0);
            const [employeeName, setEmployeeName] = useState('Max Mustermann');

            // Store entries: key YYYY-MM-DD -> { type, beginn, ende, pause, note, hours }
            const [entries, setEntries] = useState(() => {
                const saved = localStorage.getItem('zeiterfassung_entries');
                return saved ? JSON.parse(saved) : {};
            });

            // TOAST STATE (Ersetzt die Browser alert()-Meldung)
            const [toast, setToast] = useState({ show: false, message: '', type: 'success' });
            const toastTimerRef = useRef(null);

            const showToast = (message, type = 'success') => {
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                setToast({ show: true, message, type });
                toastTimerRef.current = setTimeout(() => {
                    setToast({ show: false, message: '', type: 'success' });
                }, 2500);
            };

            // Save entries to localStorage
            useEffect(() => {
                localStorage.setItem('zeiterfassung_entries', JSON.stringify(entries));
            }, [entries]);

            // Calculate Netto Minutes for current form
            const netMinutes = useMemo(() => {
                if (!beginn || !ende) return 0;
                const [bH, bM] = beginn.split(':').map(Number);
                const [eH, eM] = ende.split(':').map(Number);
                if (isNaN(bH) || isNaN(eH)) return 0;

                let startMin = bH * 60 + (bM || 0);
                let endMin = eH * 60 + (eM || 0);
                let pauseMin = parseInt(pause, 10) || 0;

                if (endMin < startMin) endMin += 24 * 60; // nightshift
                return Math.max(0, endMin - startMin - pauseMin);
            }, [beginn, ende, pause]);

            const netHoursFormatted = useMemo(() => {
                const hrs = Math.floor(netMinutes / 60);
                const mins = netMinutes % 60;
                return `${hrs} Std. ${mins} Min.`;
            }, [netMinutes]);

            // Calculate effective hours for an entry object
            const getEntryHours = (entry) => {
                if (!entry) return 0;
                const typeObj = TYPES.find(t => t.id === entry.type);
                if (typeObj && typeObj.isAbsence) {
                    return Number(sollStundenTag) || 0;
                }
                if (entry.type === 'frei') return 0;
                return entry.hours || 0;
            };

            // Handle Save Entry
            const handleSave = () => {
                const calculatedHours = entryType === 'arbeit' ? (netMinutes / 60) : Number(sollStundenTag);
                
                const newEntry = {
                    date: selectedDate,
                    type: entryType,
                    beginn: entryType === 'arbeit' ? beginn : '-',
                    ende: entryType === 'arbeit' ? ende : '-',
                    pause: entryType === 'arbeit' ? pause : '0',
                    hours: calculatedHours
                };

                setEntries(prev => ({
                    ...prev,
                    [selectedDate]: newEntry
                }));

                // Integrierte Toast-Meldung statt alert()
                showToast('Eintrag gespeichert! 🎉');
            };

            // Selected Month Stats
            const currentYearMonth = selectedDate.substring(0, 7); // YYYY-MM
            const monthStats = useMemo(() => {
                const [year, month] = currentYearMonth.split('-').map(Number);
                const daysInMonth = new Date(year, month, 0).getDate();
                
                let geleistet = 0;
                for (let d = 1; d <= daysInMonth; d++) {
                    const dateStr = `${currentYearMonth}-${String(d).padStart(2, '0')}`;
                    const entry = entries[dateStr];
                    if (entry) {
                        geleistet += getEntryHours(entry);
                    }
                }

                // Monats-Soll (Annahme: 4.4 Wochen pro Monat basierend auf Wochen-Soll)
                const monatsSoll = wochenSoll * 4.4;
                const differenz = geleistet - monatsSoll;

                return {
                    monatsSoll,
                    geleistet,
                    differenz,
                    daysInMonth
                };
            }, [entries, currentYearMonth, wochenSoll, sollStundenTag]);

            return (
                <div className="max-w-md mx-auto min-h-screen bg-slate-900 text-slate-100 flex flex-col relative pb-20">
                    
                    {/* Header */}
                    <header className="bg-blue-900 px-4 py-3.5 flex items-center justify-between border-b border-blue-800 shadow-md">
                        <div className="flex items-center gap-2">
                            <span className="text-xl">⏱️</span>
                            <h1 className="font-bold text-lg text-white tracking-wide">Zeiterfassung</h1>
                        </div>
                        <button 
                            onClick={() => window.print()}
                            className="bg-blue-800 hover:bg-blue-700 text-blue-100 text-xs px-3 py-1.5 rounded-lg flex items-center gap-1.5 border border-blue-700 transition"
                        >
                            <span>📥</span> Export
                        </button>
                    </header>

                    {/* MAIN CONTENT AREA */}
                    {tab === 'eintragen' ? (
                        <main className="p-4 flex-1 space-y-4">
                            
                            {/* Datum Auswahl */}
                            <div className="bg-slate-800 p-3 rounded-xl border border-slate-700/60 shadow">
                                <label className="block text-xs text-slate-400 mb-1">Datum</label>
                                <input 
                                    type="date"
                                    value={selectedDate}
                                    onChange={(e) => setSelectedDate(e.target.value)}
                                    className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-white focus:outline-none focus:border-blue-500"
                                />
                            </div>

                            {/* Type Grid */}
                            <div className="grid grid-cols-3 gap-2">
                                {TYPES.map(t => {
                                    const active = entryType === t.id;
                                    return (
                                        <button
                                            key={t.id}
                                            type="button"
                                            onClick={() => setEntryType(t.id)}
                                            className={`p-2.5 rounded-xl border flex items-center justify-center gap-2 text-xs font-medium transition ${
                                                active 
                                                    ? 'bg-blue-600/20 border-blue-500 text-blue-300 font-bold shadow-inner' 
                                                    : 'bg-slate-800/80 border-slate-700 text-slate-300 hover:bg-slate-700'
                                            }`}
                                        >
                                            <span className="text-sm">{t.icon}</span>
                                            <span>{t.label}</span>
                                        </button>
                                    );
                                })}
                            </div>

                            {/* Time Controls (Nur wenn Typ == Arbeit) */}
                            {entryType === 'arbeit' ? (
                                <div className="bg-slate-800 p-4 rounded-xl border border-slate-700/60 shadow space-y-3">
                                    <div className="grid grid-cols-3 gap-2 text-center">
                                        <div>
                                            <label className="block text-[11px] text-slate-400 mb-1">Beginn</label>
                                            <input 
                                                type="time" 
                                                value={beginn}
                                                onChange={(e) => setBeginn(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-1 text-xs text-center text-white focus:outline-none focus:border-blue-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] text-slate-400 mb-1">Ende</label>
                                            <input 
                                                type="time" 
                                                value={ende}
                                                onChange={(e) => setEnde(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-1 text-xs text-center text-white focus:outline-none focus:border-blue-500"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-[11px] text-slate-400 mb-1">Pause (Min)</label>
                                            <input 
                                                type="number" 
                                                step="5"
                                                value={pause}
                                                onChange={(e) => setPause(e.target.value)}
                                                className="w-full bg-slate-900 border border-slate-700 rounded-lg py-2 px-1 text-xs text-center text-white focus:outline-none focus:border-blue-500"
                                            />
                                        </div>
                                    </div>

                                    {/* Netto Arbeitszeit Box */}
                                    <div className="bg-blue-950/50 border border-blue-900/80 rounded-xl p-3 text-center">
                                        <p className="text-[11px] text-blue-300 font-medium uppercase tracking-wider">Netto-Arbeitszeit</p>
                                        <p className="text-lg font-bold text-blue-400 mt-0.5">{netHoursFormatted}</p>
                                    </div>
                                </div>
                            ) : (
                                <div className="bg-slate-800/60 p-4 rounded-xl border border-slate-700/60 text-center text-xs text-slate-400">
                                    💡 Abwesenheit <b>{TYPES.find(t=>t.id===entryType)?.label}</b> wird automatisch mit <b>{sollStundenTag} Std.</b> pauschal berechnet.
                                </div>
                            )}

                            {/* Speichern Button */}
                            <button
                                onClick={handleSave}
                                className="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-3 rounded-xl shadow-lg active:scale-95 transition flex items-center justify-center gap-2"
                            >
                                <span>💾</span> Eintrag speichern
                            </button>

                            {/* Soll-Stunden Konfiguration */}
                            <div className="bg-slate-800 p-3 rounded-xl border border-slate-700/60 flex items-center justify-between text-xs">
                                <span className="text-slate-400">Wochen-Soll (Std./Wo.):</span>
                                <input 
                                    type="number"
                                    value={wochenSoll}
                                    onChange={(e) => setWochenSoll(Number(e.target.value) || 0)}
                                    className="w-16 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-center text-white font-bold"
                                />
                            </div>

                            {/* Stat Summaries */}
                            <div className="grid grid-cols-2 gap-2">
                                <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-700/60 text-center">
                                    <p className="text-[10px] text-slate-400 uppercase font-semibold">Monats-Soll</p>
                                    <p className="text-sm font-bold text-slate-200 mt-1">{monthStats.monatsSoll.toFixed(1)} Std.</p>
                                </div>
                                <div className="bg-slate-800/80 p-3 rounded-xl border border-slate-700/60 text-center">
                                    <p className="text-[10px] text-blue-400 uppercase font-semibold">Geleistet (Ist)</p>
                                    <p className="text-sm font-bold text-blue-400 mt-1">{monthStats.geleistet.toFixed(2)} Std.</p>
                                </div>
                            </div>

                            {/* Differenz Box */}
                            <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 flex items-center justify-between">
                                <span className="text-xs text-slate-400">Differenz / Überstunden:</span>
                                <span className={`text-base font-extrabold ${monthStats.differenz >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                                    {monthStats.differenz >= 0 ? '+' : ''}{monthStats.differenz.toFixed(2)} Std.
                                </span>
                            </div>

                        </main>
                    ) : (
                        /* TAB 2: ÜBERSICHT / LISTE */
                        <main className="p-4 flex-1 space-y-3">
                            <h2 className="text-sm font-bold text-slate-300 flex items-center gap-2 mb-2">
                                📋 Monatsübersicht ({currentYearMonth})
                            </h2>
                            <div className="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden text-xs">
                                <table className="w-full text-left">
                                    <thead className="bg-slate-900 text-slate-400 border-b border-slate-700">
                                        <tr>
                                            <th className="p-2">Datum</th>
                                            <th className="p-2">Typ</th>
                                            <th className="p-2 text-right">Std.</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-700/50">
                                        {Array.from({ length: monthStats.daysInMonth }, (_, i) => {
                                            const dayNum = i + 1;
                                            const dateStr = `${currentYearMonth}-${String(dayNum).padStart(2, '0')}`;
                                            const entry = entries[dateStr];
                                            const hrs = getEntryHours(entry);
                                            const typeObj = entry ? TYPES.find(t => t.id === entry.type) : null;

                                            return (
                                                <tr key={dateStr} className={entry ? 'bg-slate-800/40' : 'opacity-40'}>
                                                    <td className="p-2 font-mono">{dayNum}.</td>
                                                    <td className="p-2">
                                                        {typeObj ? `${typeObj.icon} ${typeObj.label}` : '-'}
                                                    </td>
                                                    <td className="p-2 text-right font-mono font-bold text-slate-200">
                                                        {hrs > 0 ? `${hrs.toFixed(1)} h` : '-'}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </main>
                    )}

                    {/* NATIVE-LOOKING TOAST BENACHRICHTIGUNG (Kein Browser alert() mehr!) */}
                    {toast.show && (
                        <div className="fixed bottom-16 left-1/2 -translate-x-1/2 z-50 w-10/12 max-w-xs animate-toast">
                            <div className="flex items-center justify-between gap-3 px-4 py-3 rounded-2xl shadow-2xl bg-slate-800 border border-slate-600/80 text-white font-medium text-xs backdrop-blur-lg">
                                <div className="flex items-center gap-2">
                                    <span className="text-emerald-400 text-base">✓</span>
                                    <span className="text-slate-100">{toast.message}</span>
                                </div>
                                <button 
                                    onClick={() => setToast({ ...toast, show: false })}
                                    className="text-slate-400 hover:text-white text-xs px-1"
                                >
                                    ✕
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Bottom Navigation Bar */}
                    <nav className="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-slate-900 border-t border-slate-800 grid grid-cols-2 text-center py-2 z-40">
                        <button
                            onClick={() => setTab('eintragen')}
                            className={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${
                                tab === 'eintragen' ? 'text-blue-400 font-bold' : 'text-slate-500 hover:text-slate-300'
                            }`}
                        >
                            <span className="text-base">➕</span>
                            <span>Eintragen</span>
                        </button>
                        <button
                            onClick={() => setTab('uebersicht')}
                            className={`flex flex-col items-center gap-0.5 text-[11px] font-medium transition ${
                                tab === 'uebersicht' ? 'text-blue-400 font-bold' : 'text-slate-500 hover:text-slate-300'
                            }`}
                        >
                            <span className="text-base">📋</span>
                            <span>Übersicht</span>
                        </button>
                    </nav>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
